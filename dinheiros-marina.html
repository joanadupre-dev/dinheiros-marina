<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Dinheiros</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Montserrat',sans-serif;background:#f0fdf4;color:#1a1d2e;min-height:100dvh;overscroll-behavior:none;}
input,button,textarea,select{font-family:inherit;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
::-webkit-scrollbar{display:none;}

/* PIN SCREEN */
.pin-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:linear-gradient(160deg,#f0fdf4 0%,#d1fae5 100%);}
.pin-logo{font-size:52px;margin-bottom:8px;}
.pin-title{font-size:26px;font-weight:900;color:#1a1d2e;margin-bottom:4px;}
.pin-subtitle{font-size:13px;color:#64748b;margin-bottom:40px;}
.pin-dots{display:flex;gap:16px;margin-bottom:40px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #10b981;transition:all .15s;}
.pin-dot.filled{background:#10b981;transform:scale(1.15);}
.pin-dot.error{border-color:#ef4444;background:#ef4444;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px;}
.pin-btn{height:68px;border-radius:18px;border:1.5px solid #d1fae5;background:#fff;font-size:22px;font-weight:700;color:#1a1d2e;cursor:pointer;transition:all .1s;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.pin-btn:active{transform:scale(.93);background:#f0fdf4;}
.pin-btn .letters{font-size:8px;font-weight:600;color:#94a3b8;letter-spacing:1px;}
.pin-btn.wide{grid-column:span 1;}
.pin-btn.action{background:#f0fdf4;color:#64748b;}
.pin-btn.go{background:#10b981;color:#fff;border-color:#10b981;}
.pin-btn.go:active{background:#059669;}
.pin-error{font-size:13px;color:#ef4444;font-weight:600;margin-top:-28px;margin-bottom:12px;height:18px;}

/* ONBOARDING */
.ob-screen{min-height:100dvh;display:flex;flex-direction:column;background:#f0fdf4;}
.ob-header{padding:56px 24px 24px;background:linear-gradient(160deg,#f0fdf4 0%,#d1fae5 100%);}
.ob-step-indicator{display:flex;gap:6px;margin-bottom:20px;}
.ob-step-dot{height:4px;border-radius:99px;background:#d1fae5;flex:1;transition:background .3s;}
.ob-step-dot.active{background:#10b981;}
.ob-step-dot.done{background:#10b981;opacity:.5;}
.ob-emoji{font-size:36px;margin-bottom:8px;}
.ob-step-title{font-size:22px;font-weight:900;color:#1a1d2e;margin-bottom:4px;}
.ob-step-sub{font-size:13px;color:#64748b;line-height:1.5;}
.ob-body{flex:1;padding:24px;overflow-y:auto;}
.ob-footer{padding:16px 24px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #d1fae5;display:flex;gap:10px;}

/* MAIN APP */
.app{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;}
.app-header{padding:52px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#f0fdf4;z-index:50;border-bottom:1px solid #d1fae5;}
.app-logo{font-size:22px;font-weight:900;color:#1a1d2e;display:flex;align-items:center;gap:8px;}
.month-bar{display:flex;gap:6px;overflow-x:auto;padding:8px 20px;scrollbar-width:none;position:sticky;top:72px;background:#f0fdf4;z-index:49;}
.month-chip{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;border:1.5px solid transparent;}
.month-chip.active{background:#10b981;color:#fff;}
.month-chip.inactive{color:#64748b;}
.app-content{flex:1;padding:12px 16px 100px;overflow-y:auto;}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #d1fae5;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100;}
.tab-btn{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;font-family:inherit;}
.tab-btn .tab-icon{font-size:20px;transition:transform .15s;}
.tab-btn .tab-label{font-size:9px;font-weight:700;color:#94a3b8;letter-spacing:.3px;text-transform:uppercase;}
.tab-btn.active .tab-label{color:#10b981;}
.tab-btn.active .tab-icon{transform:scale(1.15);}

/* CARDS */
.card{background:#fff;border:1px solid #d1fae5;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04);}
.card+.card{margin-top:10px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid #d1fae5;border-radius:12px;font-size:14px;font-family:inherit;color:#1a1d2e;background:#fff;outline:none;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#10b981;}
.field textarea{resize:none;min-height:80px;}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
.toggle-row+.toggle-row{border-top:1px solid #f0fdf4;}
.toggle-label{font-size:14px;font-weight:600;color:#1a1d2e;}
.toggle-sub{font-size:11px;color:#94a3b8;margin-top:1px;}
.toggle{width:44px;height:26px;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:#10b981;}
.toggle.off{background:#d1fae5;}
.toggle::after{content:'';position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on::after{left:21px;}
.toggle.off::after{left:3px;}

/* BOTTOM SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;}
.sheet-overlay.open{opacity:1;pointer-events:all;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;z-index:201;transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92dvh;display:flex;flex-direction:column;}
.sheet.open{transform:translateX(-50%) translateY(0);}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:#d1fae5;margin:12px auto 0;}
.sheet-title{padding:16px 20px 12px;font-size:17px;font-weight:800;color:#1a1d2e;border-bottom:1px solid #f0fdf4;}
.sheet-body{padding:20px;overflow-y:auto;flex:1;}

/* FAB */
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:calc(50% - 220px);width:52px;height:52px;border-radius:50%;background:#10b981;border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(16,185,129,.4);display:flex;align-items:center;justify-content:center;z-index:99;transition:transform .15s;}
.fab:active{transform:scale(.92);}
@media(max-width:480px){.fab{right:20px;}}

/* MISC */
.section-title{font-size:13px;font-weight:800;color:#1a1d2e;text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px;}
.empty{text-align:center;color:#94a3b8;font-size:13px;padding:32px 20px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.chip{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid #d1fae5;background:#fff;color:#64748b;transition:all .15s;}
.chip.selected{background:#10b981;color:#fff;border-color:#10b981;}
.alert-toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1a1d2e;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.divider{height:1px;background:#f0fdf4;margin:12px 0;}
.row{display:flex;align-items:center;justify-content:space-between;}
.text-green{color:#10b981;}
.text-red{color:#ef4444;}
.text-muted{color:#94a3b8;}
.text-purple{color:#8b5cf6;}
.text-orange{color:#f97316;}
.fw9{font-weight:900;}
.fw7{font-weight:700;}
.fw6{font-weight:600;}
.fs11{font-size:11px;}
.fs12{font-size:12px;}
.fs13{font-size:13px;}
.fs14{font-size:14px;}
.fs18{font-size:18px;}
.fs22{font-size:22px;}
.mt4{margin-top:4px;}
.mt8{margin-top:8px;}
.mt12{margin-top:12px;}
.mt16{margin-top:16px;}
.mt20{margin-top:20px;}
.account-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
'use strict';
const {useState,useEffect,useMemo,useCallback,useRef,createElement:h,Fragment}=React;

// ── STORAGE ────────────────────────────────────────────────────────────────────
const SK_CONFIG='dinheiros_config_marina_v1';
const SK_DATA=k=>'dinheiros_data_marina_v1_'+k;
const SK_PIN='dinheiros_pin_marina_v1';

const loadJSON=key=>{try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}};
const saveJSON=(key,v)=>{try{localStorage.setItem(key,JSON.stringify(v));}catch(e){}};

// ── CRYPTO (PIN hash simples) ──────────────────────────────────────────────────
const hashPin=pin=>{
  let h=0;
  for(let i=0;i<pin.length;i++){h=(Math.imul(31,h)+pin.charCodeAt(i))|0;}
  return h+'_'+pin.length;
};

// ── HELPERS ────────────────────────────────────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2,10);
const todayStr=()=>new Date().toISOString().slice(0,10);
const DT=new Date();
const DM=DT.getMonth(),DY=DT.getFullYear();
const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MNF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const fmt=(n,currency='R$')=>{
  const abs=Math.abs(n||0);
  const s=abs.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'')+currency+' '+s;
};

// payment types
const PT_CREDIT='credit',PT_DEBIT='debit',PT_ESTIMATED='estimated',PT_BENEFIT='benefit';

// ── DEFAULT CONFIG ─────────────────────────────────────────────────────────────
const makeConfig=()=>({
  name:'',
  // accounts: [{id, name, type:'checking'|'benefit'|'savings', balance, color, emoji, currency}]
  accounts:[
    {id:'main',name:'Conta',type:'checking',balance:0,color:'#10b981',emoji:'🏦',currency:'R$'},
  ],
  // salary
  salary:0,
  salaryDay:5, // day of month salary arrives
  salaryAccountId:'main',
  // division partner
  hasDivision:false,
  partnerName:'',
  partnerSplit:50, // % partner pays
  // receivables: [{id, name, amount, accountId, type:'recurring'|'once', oM, oY}]
  receivables:[],
  // tabs
  tabs:{division:false,goals:true,food:false},
  // categories (can be customized)
  cats:null, // null = use defaults
  // theme (reserved)
  currency:'R$',
});

// ── DEFAULT CATEGORIES ─────────────────────────────────────────────────────────
const DEFAULT_CATS=[
  {id:'moradia',label:'Moradia',icon:'🏠',color:'#8b5cf6'},
  {id:'transporte',label:'Transporte',icon:'🚗',color:'#3b82f6'},
  {id:'restaurante',label:'Restaurante',icon:'🍽️',color:'#f59e0b'},
  {id:'mercado',label:'Mercado',icon:'🛒',color:'#10b981'},
  {id:'saude',label:'Saúde',icon:'❤️',color:'#ef4444'},
  {id:'lazer',label:'Lazer',icon:'🎮',color:'#8b5cf6'},
  {id:'vestuario',label:'Vestuário',icon:'👕',color:'#ec4899'},
  {id:'impostos',label:'Impostos',icon:'📋',color:'#64748b'},
  {id:'casa',label:'Casa',icon:'🏡',color:'#06b6d4'},
  {id:'pet',label:'Pet',icon:'🐾',color:'#f97316'},
  {id:'delivery',label:'Delivery',icon:'🛵',color:'#f59e0b'},
  {id:'presente',label:'Presente',icon:'🎁',color:'#ec4899'},
  {id:'outros',label:'Outros',icon:'📦',color:'#94a3b8'},
];

// ── DEFAULT DATA (per user / profile) ─────────────────────────────────────────
const makeData=()=>({
  expenses:[],
  refunds:[],
  payments:{},
  faturaPayments:{},
  closedFaturas:{},
  confirmedRcv:{},
  goals:{},
});

// ── ONBOARDING STEPS ──────────────────────────────────────────────────────────
const OB_STEPS=[
  {key:'welcome',emoji:'💸',title:'Bem-vindo ao Dinheiros',sub:'Seu controle financeiro pessoal. Vamos configurar tudo em menos de 2 minutos.'},
  {key:'pin',emoji:'🔐',title:'Crie seu PIN',sub:'4 a 6 dígitos para proteger seus dados.'},
  {key:'salary',emoji:'💰',title:'Qual seu salário?',sub:'Pode ser líquido ou bruto — o que você usa no dia a dia.'},
  {key:'accounts',emoji:'🏦',title:'Suas contas',sub:'Conta corrente já está criada. Adicione contas benefício (VA, VR) se tiver.'},
  {key:'division',emoji:'🏠',title:'Divide gastos com alguém?',sub:'Moradia, mercado, contas da casa — se você racha despesas com outra pessoa, ative aqui.'},
  {key:'tabs',emoji:'⚙️',title:'Personalizar abas',sub:'Escolha quais seções você quer usar.'},
  {key:'done',emoji:'🎉',title:'Tudo pronto!',sub:'Seus dados ficam salvos só no seu aparelho. Ninguém mais tem acesso.'},
];

// ── PRIMITIVES ────────────────────────────────────────────────────────────────
const Btn=({children,variant='primary',size='md',onClick,style={},disabled=false})=>{
  const pad={sm:'8px 16px',md:'12px 20px',lg:'14px 24px'}[size];
  const fs={sm:12,md:14,lg:15}[size];
  const styles={
    primary:{background:'#10b981',color:'#fff',border:'none'},
    secondary:{background:'#d1fae5',color:'#059669',border:'none'},
    ghost:{background:'#f1f5f9',color:'#64748b',border:'none'},
    danger:{background:'#fee2e2',color:'#ef4444',border:'none'},
    outline:{background:'transparent',color:'#10b981',border:'1.5px solid #10b981'},
  };
  const s=styles[variant]||styles.primary;
  return h('button',{onClick,disabled,style:{
    ...s,padding:pad,fontSize:fs,fontWeight:700,borderRadius:12,cursor:disabled?'not-allowed':'pointer',
    fontFamily:'Montserrat,sans-serif',opacity:disabled?.5:1,transition:'all .15s',...style
  }},children);
};

const Field=({label,children,style={}})=>h('div',{className:'field',style},[
  label&&h('label',{key:'l'},label),
  children,
]);

const Input=({label,...props})=>h(Field,{label},
  h('input',props)
);

const Select=({label,options,...props})=>h(Field,{label},
  h('select',props,options.map(o=>h('option',{key:o.value,value:o.value},o.label)))
);

const Toggle=({label,sub,value,onChange})=>h('div',{className:'toggle-row'},
  h('div',null,
    h('div',{className:'toggle-label'},label),
    sub&&h('div',{className:'toggle-sub'},sub),
  ),
  h('button',{className:'toggle '+(value?'on':'off'),onClick:()=>onChange(!value)})
);

const Sheet=({show,onClose,title,children})=>[
  h('div',{key:'o',className:'sheet-overlay '+(show?'open':''),onClick:onClose}),
  h('div',{key:'s',className:'sheet '+(show?'open':'')},
    h('div',{className:'sheet-handle'}),
    title&&h('div',{className:'sheet-title'},title),
    h('div',{className:'sheet-body'},children)
  ),
];

const Toast=({msg})=>msg?h('div',{className:'alert-toast'},msg):null;

// ── PIN SCREEN ────────────────────────────────────────────────────────────────
const PinScreen=({mode='unlock',onSuccess,onCancel})=>{
  const [digits,setDigits]=useState([]);
  const [error,setError]=useState('');
  const [shake,setShake]=useState(false);
  const maxLen=mode==='create'?6:6;

  const handleDigit=d=>{
    if(digits.length>=maxLen)return;
    const next=[...digits,d];
    setDigits(next);
    setError('');
    if(mode==='unlock'&&next.length>=4){
      // try unlock
      setTimeout(()=>tryUnlock(next),80);
    }
  };

  const tryUnlock=ds=>{
    const pin=ds.join('');
    const stored=loadJSON(SK_PIN);
    if(!stored){onSuccess(pin);return;}
    if(hashPin(pin)===stored){onSuccess(pin);}
    else{
      setDigits([]);
      setError('PIN incorreto');
      setShake(true);
      setTimeout(()=>setShake(false),500);
    }
  };

  const handleDel=()=>setDigits(d=>d.slice(0,-1));
  const handleConfirm=()=>{
    if(digits.length<4){setError('Mínimo 4 dígitos');return;}
    onSuccess(digits.join(''));
  };

  const rows=[[1,'   '],[2,'ABC'],[3,'DEF'],[4,'GHI'],[5,'JKL'],[6,'MNO'],[7,'PQRS'],[8,'TUV'],[9,'WXYZ'],['del','','del'],[0,'   '],['ok','','ok']];
  const btns=[1,2,3,4,5,6,7,8,9,'del',0,'ok'];
  const letters={'1':'   ','2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ','0':'   '};

  return h('div',{className:'pin-screen'},
    h('div',{className:'pin-logo'},'💸'),
    h('div',{className:'pin-title'},'Dinheiros'),
    h('div',{className:'pin-subtitle'},mode==='create'?'Crie seu PIN de acesso':'Bem-vindo de volta'),
    h('div',{className:'pin-dots',style:{animation:shake?'none':''}},
      Array.from({length:Math.max(4,digits.length)}).map((_,i)=>
        h('div',{key:i,className:'pin-dot'+(digits.length>i?' filled':'')+(error?' error':'')})
      )
    ),
    h('div',{className:'pin-error'},error),
    h('div',{className:'pin-grid'},
      btns.map(b=>{
        if(b==='del')return h('button',{key:'del',className:'pin-btn action',onClick:handleDel},'⌫');
        if(b==='ok'){
          if(mode==='unlock')return h('div',{key:'ok'});
          return h('button',{key:'ok',className:'pin-btn go',onClick:handleConfirm},'OK');
        }
        return h('button',{key:b,className:'pin-btn',onClick:()=>handleDigit(b)},
          h('span',null,b),
          h('span',{className:'letters'},letters[String(b)]||'')
        );
      })
    ),
    onCancel&&h('button',{onClick:onCancel,style:{marginTop:24,background:'none',border:'none',color:'#94a3b8',fontSize:13,cursor:'pointer'}},'Cancelar')
  );
};

// ── ONBOARDING ────────────────────────────────────────────────────────────────
const Onboarding=({onComplete})=>{
  const [step,setStep]=useState(0);
  const [cfg,setCfg]=useState(makeConfig());
  const [pin,setPin]=useState('');
  const [pinConfirm,setPinConfirm]=useState('');
  const [pinMode,setPinMode]=useState('create'); // create | confirm
  const [toast,setToast]=useState('');
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),2500);};

  const updateCfg=patch=>setCfg(c=>({...c,...patch}));
  const S=OB_STEPS[step];
  const total=OB_STEPS.length;

  const next=()=>{
    if(step===1){// pin step
      if(!pin){showToast('Defina um PIN primeiro');return;}
      if(pin!==pinConfirm){showToast('PINs não conferem');return;}
    }
    if(step>=total-1){
      // save pin
      saveJSON(SK_PIN,hashPin(pin));
      onComplete(cfg);
      return;
    }
    setStep(s=>s+1);
  };
  const back=()=>setStep(s=>Math.max(0,s-1));

  const addAccount=()=>{
    const name=window.prompt?window.prompt('Nome da conta (ex: VR, VA, Poupança):'):'';
    if(!name||!name.trim())return;
    updateCfg({accounts:[...cfg.accounts,{id:uid(),name:name.trim(),type:'benefit',balance:0,color:'#f59e0b',emoji:'🍽️',currency:'R$'}]});
  };

  const renderStep=()=>{
    switch(S.key){
      case 'welcome':
        return h('div',null,
          h('div',{className:'card'},
            h(Toggle,{label:'Aceito que meus dados ficam salvos localmente',sub:'Nenhum servidor, nenhum acesso externo.',value:true,onChange:()=>{}}),
          )
        );

      case 'pin':
        return h('div',null,
          pinMode==='create'
            ?h('div',null,
                h('p',{className:'fs13 text-muted',style:{marginBottom:16}},'Escolha um PIN de 4 a 6 dígitos.'),
                h('div',{className:'pin-grid',style:{maxWidth:240,margin:'0 auto'}},
                  [1,2,3,4,5,6,7,8,9,'del',0,'ok'].map(b=>{
                    if(b==='del')return h('button',{key:'del',className:'pin-btn action',onClick:()=>setPin(p=>p.slice(0,-1))},'⌫');
                    if(b==='ok')return h('button',{key:'ok',className:'pin-btn go',onClick:()=>{
                      if(pin.length<4){showToast('Mínimo 4 dígitos');return;}
                      setPinMode('confirm');
                    }},'OK');

const guessCategory=(name)=>{
  const n=(name||'').toLowerCase();
  for(const {cat,words} of KEYWORD_CATS){
    if(words.some(w=>n.includes(w)))return cat;
  }
  return 'outros';
};

const detectFormat=(rows)=>{
  // rows[0] = header row (array of strings)
  if(!rows||rows.length<2)return null;
  const h=rows[0].map(c=>(c||'').toLowerCase().trim());
  // Nubank: "date","title","amount" ou "Data","Descrição","Valor"
  if(h.includes('title')&&h.includes('amount'))return 'nubank';
  if(h.some(c=>c.includes('descrição')||c.includes('descricao'))&&h.some(c=>c.includes('valor')))return 'inter';
  if(h.some(c=>c.includes('lançamento')||c.includes('lancamento')))return 'itau';
  // Generic fallback
  return 'generic';
};

const parseCSV=(text)=>{
  const lines=text.trim().split('\n');
  return lines.map(line=>{
    const cols=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;}
      else if((ch===','||ch===';')&&!inQ){cols.push(cur.trim());cur='';}
      else cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  });
};

const parseAmount=(s)=>{
  if(!s)return 0;
  // handle "1.234,56" and "1234.56" and "-R$ 1.234,56"
  let v=s.replace(/[R$\s]/g,'').replace(',','.');
  // if has multiple dots, last is decimal
  const parts=v.split('.');
  if(parts.length>2)v=parts.slice(0,-1).join('')+'.'+parts[parts.length-1];
  return parseFloat(v)||0;
};

const parseDate=(s)=>{
  if(!s)return {m:DM,y:DY};
  // DD/MM/YYYY or YYYY-MM-DD
  const iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso)return {m:parseInt(iso[2])-1,y:parseInt(iso[1])};
  const br=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(br)return {m:parseInt(br[2])-1,y:parseInt(br[3])};
  return {m:DM,y:DY};
};

const csvToExpenses=(rows,format)=>{
  const h=rows[0].map(c=>(c||'').toLowerCase().trim());
  const get=(row,keys)=>{
    for(const k of keys){
      const i=h.findIndex(c=>c.includes(k));
      if(i>=0&&row[i]!=null)return row[i].trim();
    }
    return '';
  };
  return rows.slice(1).map(row=>{
    if(row.every(c=>!c||!c.trim()))return null;
    let name='',amtStr='',dateStr='',type='credit';
    if(format==='nubank'){
      name=get(row,['title','descrição','descricao','nome']);
      amtStr=get(row,['amount','valor']);
      dateStr=get(row,['date','data']);
    } else if(format==='inter'){
      name=get(row,['descrição','descricao','lançamento','lancamento','histórico','historico']);
      amtStr=get(row,['valor','value','amount']);
      dateStr=get(row,['data','date']);
      type=get(row,['tipo','type']).toLowerCase().includes('déb')?'debit':'credit';
    } else if(format==='itau'){
      dateStr=get(row,['data','date']);
      name=get(row,['lançamento','lancamento','descrição','descricao','histórico']);
      amtStr=get(row,['valor','value','amount','débito','debito','crédito','credito']);
    } else {
      // generic: first col=date, second=name, third=amount
      dateStr=row[0]||'';name=row[1]||'';amtStr=row[2]||'';
    }
    const amt=Math.abs(parseAmount(amtStr));
    if(!amt||!name)return null;
    const {m,y}=parseDate(dateStr);
    return {id:uid(),name:name.trim(),amount:amt,category:guessCategory(name),payType:PT_CREDIT,split:'mine',type:'once',date:dateStr,oM:m,oY:y,_imported:true};
  }).filter(Boolean);
};

// ── FINANCIAL CORE ────────────────────────────────────────────────────────────
const project=(all,m,y)=>{
  const out=[];
  for(const e of all){
    const oM=e.oM!=null?e.oM:DM,oY=e.oY!=null?e.oY:DY;
    const delta=(y-oY)*12+(m-oM);
    if(e.type==='once'){if(oM===m&&oY===y)out.push(e);}
    else if(e.type==='recurring'){if(delta>=0){const pastEnd=e.endM!=null&&(y>e.endY||(y===e.endY&&m>e.endM));if(!pastEnd)out.push({...e,_pm:m,_py:y});}}
    else if(e.type==='installment'){const ni=(e.iC||1)+delta;if(delta>=0&&ni<=(e.iT||1))out.push({...e,_pm:m,_py:y,_ni:ni});}
  }
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
};

// split helpers — generic: partner split % comes from cfg
const makeSplitHelpers=(cfg)=>{
  const pct=cfg.partnerSplit||50; // % partner pays
  const myCostE=e=>{
    if(e.split==='divisivel')return e.amount*(100-pct)/100;
    if(e.split==='partner_paid'||e.split==='partner_paid_total')return 0;
    if(e.split==='100pct_partner')return e.amount;
    if(e.split==='mine_div')return e.amount; // eu pago tudo, ela me reembolsa
    return e.amount;
  };
  const partnerOwesE=e=>{
    if(e.split==='divisivel'||e.split==='mine_div')return e.amount*pct/100;
    if(e.split==='100pct_partner')return e.amount;
    return 0;
  };
  const myOwesToPartner=e=>{
    if(e.split==='partner_paid')return e.amount*(100-pct)/100;
    if(e.split==='partner_paid_total')return e.amount;
    return 0;
  };
  return {myCostE,partnerOwesE,myOwesToPartner};
};

  const saveFinal=()=>{

  return h(Sheet,{show,onClose:handleClose,title:'➕ Novo lançamento'},

const TabVisao=({cfg,data,upd,selM,selY,cats,showToast})=>{
  const accounts=cfg.accounts||[];
  const hasDivision=cfg.hasDivision&&cfg.partnerName;
  const partner=cfg.partnerName||'Parceiro';
  const {myCostE,partnerOwesE,myOwesToPartner}=makeSplitHelpers(cfg);
  const mExp=useMemo(()=>project(data.expenses,selM,selY),[data.expenses,selM,selY]);
  const mRefunds=useMemo(()=>(data.refunds||[]).filter(r=>r.oM===selM&&r.oY===selY),[data.refunds,selM,selY]);
  const salN=parseFloat(cfg.salary)||0;
  const isPaid=e=>!!(data.payments||{})[`${e.id}:${selM}:${selY}`];
  const faturaKey=`${selM}:${selY}`;
  const faturaFechada=(data.closedFaturas||{})[faturaKey];
  const creditExp=mExp.filter(e=>e.payType===PT_CREDIT&&e.split!=='partner_paid'&&e.split!=='partner_paid_total');
  const faturaTotal=faturaFechada?faturaFechada.total:creditExp.reduce((s,e)=>s+Math.abs(e.amount),0);
  const faturaJaPaga=useMemo(()=>{const fp=data.faturaPayments&&data.faturaPayments[faturaKey];return fp?fp.total:0;},[data.faturaPayments,faturaKey]);
  const debitExp=mExp.filter(e=>(e.payType===PT_DEBIT||e.payType===PT_ESTIMATED)&&e.split!=='partner_paid'&&e.split!=='partner_paid_total');
  const estTotal=useMemo(()=>debitExp.filter(e=>e.payType===PT_ESTIMATED&&!isPaid(e)).reduce((s,e)=>s+myCostE(e),0),[debitExp,data.payments]);
  const mRcv=useMemo(()=>project(cfg.receivables||[],selM,selY),[cfg.receivables,selM,selY]);
  const pendingRcv=mRcv.filter(r=>!(data.payments||{})[`rcv:${r.id}:${selM}:${selY}`]).reduce((s,r)=>s+r.amount,0);
  const partnerNet=useMemo(()=>{
    if(!hasDivision)return 0;
    const owe=mExp.filter(e=>e.split==='divisivel'||e.split==='mine_div'||e.split==='100pct_partner').reduce((s,e)=>s+partnerOwesE(e),0);
    const iOwe=mExp.filter(e=>e.split==='partner_paid'||e.split==='partner_paid_total').reduce((s,e)=>s+myOwesToPartner(e),0);
    const pixP=(data.refunds||[]).filter(r=>r.oM===selM&&r.oY===selY&&r.isPixPartner).reduce((s,r)=>s+r.amount,0);
    return owe-iOwe-pixP;
  },[hasDivision,mExp,data.refunds,selM,selY]);
  const nextGap=salN+pendingRcv+(hasDivision?partnerNet:0)-faturaTotal-estTotal;
  const nextM=(selM+1)%12;
  const byCategory=useMemo(()=>{
    const map={};
    for(const e of mExp){const c=myCostE(e);map[e.category]=(map[e.category]||0)+c;}
    return (cats||DEFAULT_CATS).map(c=>({...c,total:map[c.id]||0})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  },[mExp]);
  const totalRcvAmt=mRcv.reduce((s,r)=>s+r.amount,0);
  const totalRefunds=mRefunds.reduce((s,r)=>s+r.amount,0);

  return h('div',null,
    // account cards
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}},
      accounts.map(a=>h('div',{key:a.id,className:'card',style:{borderLeft:'4px solid '+a.color}},
        h('div',{className:'fs10 fw7',style:{color:a.color,textTransform:'uppercase',letterSpacing:.5,marginBottom:4}},a.emoji+' '+a.name),
        h('div',{style:{fontSize:20,fontWeight:900,color:a.balance>=0?'#1a1d2e':'#ef4444'}},fmt(a.balance,a.currency||'R$')),
        h('div',{className:'fs11 text-muted'},'saldo atual'),
      )),
      h('div',{className:'card',style:{borderLeft:'4px solid #8b5cf6',cursor:'pointer'}},
        h('div',{className:'fs10 fw7',style:{color:'#8b5cf6',textTransform:'uppercase',letterSpacing:.5,marginBottom:4}},'💳 Fatura '+MN[selM]),
        h('div',{style:{fontSize:20,fontWeight:900,color:'#8b5cf6'}},fmt(faturaTotal)),
        h('div',{className:'fs11 text-muted'},faturaJaPaga>0?'✅ pago R$'+faturaJaPaga.toFixed(2).replace('.',','):'vence em '+MN[nextM])
      ),
      h('div',{className:'card',style:{borderLeft:'4px solid '+(nextGap>=0?'#10b981':'#ef4444')}},
        h('div',{className:'fs10 fw7',style:{color:'#64748b',textTransform:'uppercase',letterSpacing:.5,marginBottom:4}},'🔮 '+MN[selM]+' — prev.'),
        h('div',{style:{fontSize:20,fontWeight:900,color:nextGap>=0?'#10b981':'#ef4444'}},fmt(nextGap)),
        h('div',{className:'fs11 text-muted'},nextGap>=0?'sobra estimada':'falta estimada')
      )
    ),
    // partner
    hasDivision&&partnerNet!==0&&h('div',{className:'card',style:{marginBottom:10,borderLeft:'4px solid '+(partnerNet>0?'#0d9488':'#f97316'),padding:14}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,
          h('div',{className:'fs13 fw7 text-muted'},partnerNet>0?'💑 '+partner+' ainda te deve':'💑 Você ainda deve a '+partner),
          h('div',{className:'fw9',style:{color:partnerNet>0?'#0d9488':'#f97316',fontSize:16}},fmt(Math.abs(partnerNet)))
        )
      )
    ),
    // recebíveis
    totalRcvAmt>0&&h('div',{className:'card',style:{marginBottom:10,padding:14}},
      h('div',{style:{display:'flex',justifyContent:'space-between'}},
        h('span',{className:'fs13 fw7 text-muted'},'💰 Recebíveis '+MN[selM]),
        h('span',{className:'fw9 text-green fs16'},fmt(totalRcvAmt))
      )
    ),
    // by category
    byCategory.length>0&&h('div',{className:'card',style:{padding:14}},
      h('div',{className:'fw7 fs13 text-muted',style:{marginBottom:10}},'📊 Por categoria'),
      byCategory.map(c=>{
        const goal=(data.goals||{})[`${c.id}:${selM}:${selY}`]||0;
        const pct=goal>0?Math.min(100,c.total/goal*100):0;
        return h('div',{key:c.id,style:{marginBottom:10}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}},
            h('span',{className:'fs13 fw7'},c.icon+' '+c.label),
            h('span',{className:'fw9 fs14',style:{color:goal>0&&c.total>goal?'#ef4444':c.color}},fmt(c.total))
          ),
          h('div',{style:{height:4,background:'#f0fdf4',borderRadius:99,overflow:'hidden'}},
            h('div',{style:{width:(goal>0?pct:Math.min(100,c.total/1000*100))+'%',height:'100%',background:goal>0&&c.total>goal?'#ef4444':c.color,borderRadius:99,transition:'width .4s'}})
          )
        );
      })
    )
  );
};

// ── TAB: GASTOS ────────────────────────────────────────────────────────────────
const TabGastos=({cfg,data,upd,selM,selY,cats,showToast,setShowAdd})=>{
  const [searchQ,setSearchQ]=useState('');
  const [showPayConfirm,setShowPayConfirm]=useState(null);
  const [payRealAmt,setPayRealAmt]=useState('');
  const [editingExp,setEditingExp]=useState(null);
  const [editForm,setEditForm]=useState({});
  const [confirmAction,setConfirmAction]=useState(null);
  const partner=cfg.partnerName||'Parceiro';
  const {myCostE}=makeSplitHelpers(cfg);
  const mExp=useMemo(()=>project(data.expenses,selM,selY),[data.expenses,selM,selY]);
  const payKey=e=>`${e.id}:${selM}:${selY}`;
  const isPaid=e=>!!(data.payments||{})[payKey(e)];
  const getPayment=e=>(data.payments||{})[payKey(e)];
  const realAmt=e=>{const p=getPayment(e);return p&&p.realAmount!=null?p.realAmount:myCostE(e);};
  const myCost=e=>myCostE(e);
  const creditExp=mExp.filter(e=>e.payType===PT_CREDIT&&e.split!=='partner_paid'&&e.split!=='partner_paid_total');
  const estExp=mExp.filter(e=>e.payType===PT_ESTIMATED&&e.split!=='partner_paid'&&e.split!=='partner_paid_total');
  const pixExp=mExp.filter(e=>e.payType===PT_DEBIT&&e.split!=='partner_paid'&&e.split!=='partner_paid_total');
  const benefitExp=mExp.filter(e=>e.payType===PT_BENEFIT);
  const faturaKey=`${selM}:${selY}`;
  const faturaFechada=(data.closedFaturas||{})[faturaKey];
  const faturaTotal=faturaFechada?faturaFechada.total:creditExp.reduce((s,e)=>s+Math.abs(e.amount),0);
  const faturaStatus=faturaFechada?'fechada':'aberta';
  const nextM=(selM+1)%12;
  const filter=list=>searchQ?list.filter(e=>e.name.toLowerCase().includes(searchQ.toLowerCase())):list;

  const confirmPayment=(e,realAmount)=>{
    const paid=parseFloat(realAmount)||myCost(e);
    upd(d=>{
      if(!d.payments)d.payments={};
      d.payments[`${e.id}:${selM}:${selY}`]={date:todayStr(),realAmount:paid};
      // find main account and deduct
      const mainAcc=(d.accounts||[]).find(a=>a.type==='checking')||(d.accounts||[])[0];
      if(mainAcc)mainAcc.balance=(parseFloat(mainAcc.balance)||0)-paid;
      return d;
    });
    setShowPayConfirm(null);setPayRealAmt('');
    showToast('✅ Pago! -'+fmt(paid));
  };
  const unconfirmPayment=e=>{
    upd(d=>{
      const k=`${e.id}:${selM}:${selY}`;
      const p=(d.payments||{})[k];
      if(p){
        const refund=p.realAmount!=null?p.realAmount:myCost(e);
        const mainAcc=(d.accounts||[]).find(a=>a.type==='checking')||(d.accounts||[])[0];
        if(mainAcc)mainAcc.balance=(parseFloat(mainAcc.balance)||0)+refund;
        delete d.payments[k];
      }
      return d;
    });
  };
  const doRemoveExp=id=>upd(d=>{
    const ex=d.expenses.find(x=>x.id===id);
    if(ex){
      if(ex.payType===PT_BENEFIT){
        const acc=(d.accounts||[]).find(a=>a.id===ex.accountId);
        if(acc)acc.balance=(parseFloat(acc.balance)||0)+ex.amount;
      }
      if(ex.payType===PT_DEBIT||ex.payType===PT_ESTIMATED){
        const keys=Object.keys(d.payments||{}).filter(k=>k.startsWith(ex.id+':'));
        keys.forEach(k=>{
          const p=d.payments[k];
          const paid=p.realAmount!=null?p.realAmount:myCostE(ex);
          const mainAcc=(d.accounts||[]).find(a=>a.type==='checking')||(d.accounts||[])[0];
          if(mainAcc&&paid>0)mainAcc.balance=(parseFloat(mainAcc.balance)||0)+paid;
          delete d.payments[k];
        });
      }
    }
    d.expenses=d.expenses.filter(x=>x.id!==id);
    return d;
  });
  const removeExp=id=>{
    const e=data.expenses.find(x=>x.id===id);
    setConfirmAction({message:'Excluir "'+(e?e.name:'')+'"?',onYes:()=>doRemoveExp(id)});
  };
  const startEdit=e=>{
    setEditForm({name:e.name,category:e.category,amount:String(e.amount),payType:e.payType,split:e.split||'mine',type:e.type,iC:String(e.iC||1),iT:String(e.iT||1),date:e.date||todayStr()});
    setEditingExp(e);
  };
  const saveEdit=(scope)=>upd(d=>{
    const isRecurring=editingExp.type==='recurring'||editingExp.type==='installment';
    if(isRecurring&&scope==='forward'){
      const idx=d.expenses.findIndex(e=>e.id===editingExp.id);
      if(idx>=0){
        const old=d.expenses[idx];
        const hasHistory=Object.keys(d.payments||{}).some(k=>k.startsWith(old.id+':'));
        if(!hasHistory&&old.oM===selM&&old.oY===selY){
          d.expenses[idx]={...old,name:editForm.name.trim(),category:editForm.category,amount:parseFloat(editForm.amount),split:editForm.split,type:editForm.type};
        } else {
          const prevM=selM===0?11:selM-1,prevY=selM===0?selY-1:selY;
          d.expenses[idx]={...old,endM:prevM,endY:prevY};
          d.expenses.push({id:uid(),name:editForm.name.trim(),category:editForm.category,amount:parseFloat(editForm.amount),payType:editForm.payType,split:editForm.split,type:editForm.type,iC:editForm.type==='installment'?parseInt(editForm.iC):undefined,iT:editForm.type==='installment'?parseInt(editForm.iT):undefined,date:`${selY}-${String(selM+1).padStart(2,'0')}-01`,oM:selM,oY:selY});
        }
      }
    } else {
      const idx=d.expenses.findIndex(e=>e.id===editingExp.id);
      if(idx>=0){
        const old=d.expenses[idx];
        const newAmt=parseFloat(editForm.amount);
        if(old.payType===PT_DEBIT&&editForm.payType===PT_DEBIT){
          const oldC=myCostE(old),newC=myCostE({...old,amount:newAmt,split:editForm.split});
          const diff=newC-oldC;
          if(diff!==0){
            const mainAcc=(d.accounts||[]).find(a=>a.type==='checking')||(d.accounts||[])[0];
            if(mainAcc)mainAcc.balance=(parseFloat(mainAcc.balance)||0)-diff;
            const k=Object.keys(d.payments||{}).find(k=>k.startsWith(old.id+':'));
            if(k&&d.payments[k])d.payments[k].realAmount=newC;
          }
        }
        d.expenses[idx]={...d.expenses[idx],name:editForm.name.trim(),category:editForm.category,amount:newAmt,payType:editForm.payType,split:editForm.split,type:editForm.type,iC:editForm.type==='installment'?parseInt(editForm.iC):undefined,iT:editForm.type==='installment'?parseInt(editForm.iT):undefined,date:editForm.date};
      }
    }
    return d;
  });

  const expRowProps=(e)=>({e,cfg,isPaid,realAmt,myCost,selM,selY,onPay:e=>setShowPayConfirm(e),onUnpay:unconfirmPayment,onEdit:startEdit,onRemove:removeExp,onDuplicate:e=>{upd(d=>{d.expenses.push({...e,id:uid(),_pm:undefined,_py:undefined,_ni:undefined,type:'once',iC:undefined,iT:undefined,date:todayStr(),oM:selM,oY:selY});return d;});showToast('📄 Duplicado!');}});

  const SectionCard=({title,headerBg,headerColor,list,total,emptyMsg})=>h('div',{style:{marginBottom:10}},
    h('div',{className:'fw9 fs13',style:{marginBottom:6}},title),
    h('div',{className:'card',style:{padding:0,overflow:'hidden'}},
      h('div',{style:{padding:'10px 14px',background:headerBg,borderBottom:'1px solid #d1fae5',fontSize:12,fontWeight:700,color:headerColor,display:'flex',justifyContent:'space-between'}},
        h('span',title),h('span',fmt(total))
      ),
      list.length===0?h('div',{className:'empty'},emptyMsg):filter(list).map(e=>h(ExpRow,{key:e.id+(e._pm||''),...expRowProps(e)}))
    )
  );

  return h('div',null,
    // confirm modal
    confirmAction&&h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      h('div',{style:{background:'#fff',borderRadius:20,padding:24,maxWidth:320,width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,.2)'}},
        h('div',{className:'fw9 fs16',style:{marginBottom:8}},'Confirmar'),
        h('div',{className:'fs14 text-muted',style:{marginBottom:20}},confirmAction.message),
        h('div',{style:{display:'flex',gap:10}},
          h(Btn,{variant:'ghost',onClick:()=>setConfirmAction(null),style:{flex:1}},'Cancelar'),
          h(Btn,{variant:'danger',onClick:()=>{confirmAction.onYes();setConfirmAction(null);},style:{flex:1}},'Excluir')
        )
      )
    ),
    // pay confirm
    showPayConfirm&&h(Sheet,{show:true,onClose:()=>setShowPayConfirm(null),title:'✅ Confirmar pagamento'},
      h('div',{style:{marginBottom:16}},
        h('div',{className:'fw7 fs16',style:{marginBottom:4}},showPayConfirm.name),
        h('div',{className:'fs13 text-muted'},'Valor estimado: '+fmt(myCost(showPayConfirm)))
      ),
      h(Field,{label:'Valor real pago (deixe em branco pra usar o estimado)'},
        h('input',{type:'number',inputMode:'decimal',value:payRealAmt,onChange:e=>setPayRealAmt(e.target.value),placeholder:String(myCost(showPayConfirm)),style:{width:'100%',padding:'12px',border:'1.5px solid #d1fae5',borderRadius:10,fontSize:16,fontFamily:'Montserrat,sans-serif'}})
      ),
      h(Btn,{onClick:()=>confirmPayment(showPayConfirm,payRealAmt||null),style:{width:'100%',padding:'14px',marginTop:8}},'✅ Confirmar pagamento')
    ),
    // search
    h('div',{style:{position:'relative',marginBottom:12}},
      h('input',{value:searchQ,onChange:e=>setSearchQ(e.target.value),placeholder:'🔍 Buscar lançamento…',style:{width:'100%',background:'#f8fffe',border:'1.5px solid #d1fae5',borderRadius:10,padding:'10px 36px 10px 14px',fontSize:14,color:'#1a1d2e',fontFamily:'Montserrat,sans-serif'}}),
      searchQ&&h('button',{onClick:()=>setSearchQ(''),style:{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:16}},'×')
    ),
    // fatura card
    h('div',{className:'card',style:{marginBottom:10,background:'linear-gradient(135deg,#faf5ff,#ede9fe)',border:'1.5px solid #8b5cf644',padding:14}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,
          h('div',{className:'fw9 fs14',style:{color:'#8b5cf6'}},'💳 Fatura '+MN[selM]+'/'+selY),
          h('div',{className:'fs11',style:{color:'#8b5cf6',opacity:.7}},(faturaStatus==='fechada'?'✅ Fechada':'🔓 Aberta')+' · '+creditExp.length+' itens · vence '+MN[nextM])
        ),
        h('div',{style:{textAlign:'right'}},
          h('div',{className:'fw9 fs22',style:{color:'#8b5cf6'}},fmt(faturaTotal)),
          faturaStatus==='fechada'
            ?h('button',{onClick:()=>{setConfirmAction({message:'Reabrir fatura de '+MNF[selM]+'?',onYes:()=>upd(d=>{if(d.closedFaturas)delete d.closedFaturas[faturaKey];return d;})});},style:{background:'none',border:'none',fontSize:11,color:'#8b5cf6',cursor:'pointer',textDecoration:'underline',padding:0}},'reabrir')
            :h('button',{onClick:()=>{const v=prompt('Fechar fatura '+MNF[selM]+' com qual total? (vazio = '+fmt(faturaTotal)+')');if(v===null)return;const t=v.trim()===''?faturaTotal:parseFloat(v.replace(',','.'));if(isNaN(t)){showToast('Valor inválido');return;}upd(d=>{if(!d.closedFaturas)d.closedFaturas={};d.closedFaturas[faturaKey]={total:t,closedAt:todayStr()};return d;});showToast('✅ Fatura fechada: '+fmt(t));},style:{background:'none',border:'none',fontSize:11,color:'#8b5cf6',cursor:'pointer',textDecoration:'underline',padding:0}},'fechar')
        )
      )
    ),
    h(SectionCard,{title:'📋 Estimado',headerBg:'#fff7ed',headerColor:'#f97316',list:estExp,total:estExp.reduce((s,e)=>s+(isPaid(e)?realAmt(e):myCost(e)),0),emptyMsg:'Nenhum estimado'}),
    h(SectionCard,{title:'🏦 Débito / PIX',headerBg:'#eff6ff',headerColor:'#3b82f6',list:pixExp,total:pixExp.reduce((s,e)=>s+myCost(e),0),emptyMsg:'Nenhum'}),
    benefitExp.length>0&&h(SectionCard,{title:'🍽️ Benefício',headerBg:'#fef3c7',headerColor:'#f59e0b',list:benefitExp,total:benefitExp.reduce((s,e)=>s+e.amount,0),emptyMsg:'Nenhum'}),
    h('div',{className:'fw9 fs13',style:{marginBottom:6}},'💳 Crédito (fatura)'),
    h('div',{className:'card',style:{padding:0,overflow:'hidden',marginBottom:10}},

        h('span','💳 CRÉDITO'),h('span',fmt(creditExp.reduce((s,e)=>s+myCost(e),0)))
      ),
      creditExp.length===0?h('div',{className:'empty'},'Nenhum'):filter(creditExp).map(e=>h(ExpRow,{key:e.id+(e._pm||''),...expRowProps(e)}))

            (cats||DEFAULT_CATS).map(c=>h('option',{key:c.id,value:c.id},c.icon+' '+c.label))
          )

      )
    )
  );

// ── TAB: PRÓXIMO ──────────────────────────────────────────────────────────────
const TabProximo=({cfg,data,selM,selY})=>{
  const {myCostE}=makeSplitHelpers(cfg);
  const nextM=(selM+1)%12,nextY=selM===11?selY+1:selY;
  const nextExp=useMemo(()=>project(data.expenses,nextM,nextY),[data.expenses,nextM,nextY]);
  const nextRcv=useMemo(()=>project(cfg.receivables||[],nextM,nextY),[cfg.receivables,nextM,nextY]);
  const salN=parseFloat(cfg.salary)||0;
  const creditNext=nextExp.filter(e=>e.payType===PT_CREDIT&&e.split!=='partner_paid'&&e.split!=='partner_paid_total');
  const estNext=nextExp.filter(e=>(e.payType===PT_ESTIMATED||e.payType===PT_DEBIT)&&e.split!=='partner_paid'&&e.split!=='partner_paid_total');
  const creditTotal=creditNext.reduce((s,e)=>s+Math.abs(myCostE(e)),0);
  const estTotal=estNext.reduce((s,e)=>s+myCostE(e),0);
  const rcvTotal=nextRcv.reduce((s,r)=>s+r.amount,0);
  const gap=salN+rcvTotal-creditTotal-estTotal;
  const cats=cfg.cats||DEFAULT_CATS;
  const Row=({e})=>{
    const cat=cats.find(c=>c.id===e.category)||{icon:'📦',color:'#94a3b8'};
    const pt=PAY_COLORS[e.payType]||PAY_COLORS[PT_CREDIT];
    const ni=e._ni||e.iC;
    return h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid #f0fdf4'}},
      h('div',{style:{width:32,height:32,borderRadius:9,background:cat.color+'25',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}},cat.icon),
      h('div',{style:{flex:1}},
        h('div',{className:'fw7 fs13'},e.name+(ni?` ${ni}/${e.iT||'?'}x`:'')),
        h('span',{className:'badge fs10',style:{background:pt.bg,color:pt.color}},pt.icon+' '+pt.label)
      ),
      h('div',{className:'fw9 fs14',style:{color:'#ef4444'}},fmt(Math.abs(myCostE(e))))
    );
  };
  return h('div',null,
    h('div',{className:'card',style:{marginBottom:12,textAlign:'center',padding:'20px 16px',borderLeft:'4px solid '+(gap>=0?'#10b981':'#ef4444')}},
      h('div',{className:'fs11 fw7 text-muted',style:{marginBottom:4,textTransform:'uppercase',letterSpacing:.5}},'🔮 Balanço de '+MN[nextM]),
      h('div',{style:{fontSize:28,fontWeight:900,color:gap>=0?'#10b981':'#ef4444'}},fmt(gap)),
      h('div',{className:'fs12 text-muted',style:{marginTop:4}},fmt(salN+rcvTotal)+' entram · '+fmt(creditTotal+estTotal)+' saem')
    ),
    creditNext.length>0&&h('div',null,
      h('div',{className:'section-title'},'💳 Crédito ('+MN[nextM]+')'),
      h('div',{className:'card',style:{padding:0,overflow:'hidden',marginBottom:10}},creditNext.map(e=>h(Row,{key:e.id+(e._pm||''),e})))
    ),
    estNext.length>0&&h('div',null,
      h('div',{className:'section-title'},'📋 Estimados / Débito'),
      h('div',{className:'card',style:{padding:0,overflow:'hidden',marginBottom:10}},estNext.map(e=>h(Row,{key:e.id+(e._pm||''),e})))
    ),
    nextRcv.length>0&&h('div',null,
      h('div',{className:'section-title'},'💰 Recebíveis'),
      h('div',{className:'card',style:{padding:0,overflow:'hidden'}},
        nextRcv.map(r=>h('div',{key:r.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',borderBottom:'1px solid #f0fdf4'}},
          h('span',{className:'fw7 fs14'},r.name),
          h('span',{className:'fw9 text-green'},fmt(r.amount))
        ))
      )
    )
  );
};

// ── TAB: METAS ────────────────────────────────────────────────────────────────

        goal>0&&h('div',{style:{height:5,background:'#f0fdf4',borderRadius:99}},
          h('div',{style:{width:pct+'%',height:'100%',background:over?'#ef4444':c.color,borderRadius:99,transition:'width .4s'}})

        h(Btn,{onClick:()=>{upd(d=>{if(!d.goals)d.goals={};d.goals[`${editGoal.id}:${selM}:${selY}`]=parseFloat(goalVal)||0;return d;});setEditGoal(null);showToast('✅ Meta salva!');},style:{flex:1,padding:'13px'}},'Salvar'),

      )

  );
};

      h(Section,{title:'100% dela — você pagou',color:'#ef4444',list:iOwe.filter(e=>e.split==='100pct_partner'),getAmt:e=>e.amount}),
    ),
    partnerOwed.length>0&&h('div',{className:'card',style:{marginBottom:10}},
      h(Section,{title:'50/50 — '+partner+' pagou',color:'#f97316',list:partnerOwed.filter(e=>e.split==='partner_paid'),getAmt:e=>myOwesToPartner(e)}),
      h(Section,{title:'100% seu — '+partner+' pagou',color:'#8b5cf6',list:partnerOwed.filter(e=>e.split==='partner_paid_total'),getAmt:e=>myOwesToPartner(e)}),
    ),
    h('div',{className:'card',style:{background:'#f0fdf4',padding:16}},
      h('div',{className:'fw9 fs13',style:{marginBottom:8}},'📊 Fechamento'),
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
        h('span',{className:'fs13'},partner+' te deve (você pagou por ela)'),
        h('span',{className:'fw7 text-green'},fmt(gfOwes))
      ),
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
        h('span',{className:'fs13'},'Você deve a '+partner+' (ela pagou)'),
        h('span',{className:'fw7 text-orange'},fmt(joanaOwes))
      ),
      pixP>0&&h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
        h('span',{className:'fs13'},'✓ '+partner+' já pagou (Pix)'),
        h('span',{className:'fw7 text-muted'},'-'+fmt(pixP))
      ),
      h('div',{style:{borderTop:'1px solid #d1fae5',marginTop:8,paddingTop:8,display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,
          h('div',{className:'fw9 fs15'},net>0?partner+' te paga':'Você paga '+partner),
          h('div',{style:{fontSize:24,fontWeight:900,color:net>0?'#10b981':'#f97316'}},fmt(Math.abs(net)))
        ),
        net>0&&h(Btn,{variant:'secondary',onClick:()=>setShowPixPartner(true)},'+Recebi Pix')
      )
    ),
    h(Sheet,{show:showPixPartner,onClose:()=>setShowPixPartner(false),title:'💑 Pix de '+partner},
      h(Field,{label:'Valor recebido'},
        h('input',{type:'number',inputMode:'decimal',value:pixAmt,onChange:e=>setPixAmt(e.target.value),placeholder:'0,00',style:{width:'100%',padding:'12px',border:'1.5px solid #d1fae5',borderRadius:10,fontSize:16,fontFamily:'Montserrat,sans-serif'}})
      ),
      h(Btn,{onClick:()=>{
        const amt=parseFloat(pixAmt.replace(',','.'));
        if(!amt)return;
        upd(d=>{
          if(!d.refunds)d.refunds=[];
          d.refunds.push({id:uid(),rcvType:'pix_partner',name:'Pix '+partner,amount:amt,isPixPartner:true,oM:selM,oY:selY,date:todayStr()});
          const mainAcc=(d.accounts||[]).find(a=>a.type==='checking')||(d.accounts||[])[0];
          if(mainAcc)mainAcc.balance=(parseFloat(mainAcc.balance)||0)+amt;
          return d;
        });
        showToast('✅ Pix de '+fmt(amt)+' registrado!');
        setShowPixPartner(false);setPixAmt('');
      },style:{width:'100%',padding:'14px',marginTop:8}},'✓ Confirmar')
    )
  );
};

// ── TAB: ALIMENTAÇÃO ──────────────────────────────────────────────────────────
const TabAliment=({cfg,data,upd,selM,selY,cats,showToast})=>{
  const accounts=cfg.accounts||[];
  const benefitAccs=accounts.filter(a=>a.type==='benefit');
  const mExp=useMemo(()=>project(data.expenses,selM,selY),[data.expenses,selM,selY]);
  const benefitExp=mExp.filter(e=>e.payType===PT_BENEFIT);
  const byAccount=benefitAccs.map(a=>({
    acc:a,
    exps:benefitExp.filter(e=>e.accountId===a.id),
    total:benefitExp.filter(e=>e.accountId===a.id).reduce((s,e)=>s+e.amount,0)
  }));
  const catMap=cats||DEFAULT_CATS;
  if(benefitAccs.length===0)return h('div',{className:'card',style:{textAlign:'center',padding:24}},
    h('div',{style:{fontSize:36,marginBottom:8}},'🍽️'),
    h('div',{className:'fw7 fs14'},'Nenhuma conta benefício configurada'),
    h('div',{className:'fs13 text-muted',style:{marginTop:4}},'Adicione VA ou VR nas configurações.')
  );
  return h('div',null,
    byAccount.map(({acc,exps,total})=>h('div',{key:acc.id,style:{marginBottom:12}},
      h('div',{className:'card',style:{marginBottom:6,borderLeft:'4px solid '+acc.color,padding:'12px 14px'}},
        h('div',{style:{display:'flex',justifyContent:'space-between'}},
          h('div',null,
            h('div',{className:'fw9 fs15'},acc.emoji+' '+acc.name),
            h('div',{className:'fs12 text-muted'},fmt(acc.balance,acc.currency||'R$')+' disponível')
          ),
          h('div',{style:{textAlign:'right'}},
            h('div',{className:'fw9 fs18',style:{color:'#ef4444'}},'-'+fmt(total)),
            h('div',{className:'fs11 text-muted'},'gasto este mês')
          )
        )
      ),
      exps.length>0&&h('div',{className:'card',style:{padding:0,overflow:'hidden'}},
        exps.map(e=>{
          const cat=catMap.find(c=>c.id===e.category)||{icon:'📦',color:'#94a3b8'};
          return h('div',{key:e.id+(e._pm||''),style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid #f0fdf4'}},
            h('div',{style:{width:32,height:32,borderRadius:9,background:cat.color+'25',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}},cat.icon),
            h('div',{style:{flex:1}},h('div',{className:'fw7 fs13'},e.name)),
            h('div',{className:'fw9 fs14',style:{color:'#f59e0b'}},fmt(e.amount))
          );
        })
      )
    ))
  );
};

// ── MAIN APP SHELL ─────────────────────────────────────────────────────────────
const App=({cfg,data,onUpdateCfg,onUpdateData,onLock})=>{
  const [selM,setSelM]=useState(DM);
  const [selY,setSelY]=useState(DY);
  const [tab,setTab]=useState('visao');
  const [showSettings,setShowSettings]=useState(false);
  const [toast,setToast]=useState('');
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),2500);};

  const cats=cfg.cats||DEFAULT_CATS;
  const partner=cfg.partnerName||'Ela';
  const accounts=cfg.accounts||[];
  const mainAcc=accounts.find(a=>a.type==='checking')||accounts[0];
  const benefitAccs=accounts.filter(a=>a.type==='benefit');

  const [showAdd,setShowAdd]=useState(false);

  const handleAdd=item=>{
    if(item.type==='confirm_salary'){
      onUpdateData(d=>{
        const acc=(d.accounts||[]).find(a=>a.id===item.accountId)||(d.accounts||[])[0];
        if(acc)acc.balance=(parseFloat(acc.balance)||0)+item.amount;
        if(!d.confirmedRcv)d.confirmedRcv={};
        d.confirmedRcv[`sal:${DM}:${DY}`]={date:todayStr()};
        return d;
      });
      showToast('✅ Salário de '+fmt(item.amount)+' adicionado!');
      return;
    }
    if(item.type==='confirm_benefit'){
      onUpdateData(d=>{
        const acc=(d.accounts||[]).find(a=>a.id===item.accountId);
        if(acc)acc.balance=(parseFloat(acc.balance)||0)+item.amount;
        if(!d.confirmedRcv)d.confirmedRcv={};
        d.confirmedRcv[`ben:${item.accountId}:${DM}:${DY}`]={date:todayStr()};
        return d;
      });
      showToast('✅ '+fmt(item.amount)+' adicionado!');
      return;
    }
    if(item.type==='confirm_rcv'){
      onUpdateData(d=>{
        if(!d.payments)d.payments={};
        d.payments[`rcv:${item.rcvId}:${DM}:${DY}`]={date:todayStr(),amount:item.amount};
        const acc=(d.accounts||[]).find(a=>a.id===item.accountId)||(d.accounts||[])[0];
        if(acc)acc.balance=(parseFloat(acc.balance)||0)+item.amount;
        return d;
      });
      showToast('✅ Recebível confirmado!');
      return;
    }
    if(item.isRefund){
      onUpdateData(d=>{
        if(!d.refunds)d.refunds=[];
        d.refunds.push(item);
        if(item.isPixPartner||item.rcvType==='pix_outro'||item.rcvType==='pix_partner'){
          const acc=(d.accounts||[]).find(a=>a.type==='checking')||(d.accounts||[])[0];
          if(acc)acc.balance=(parseFloat(acc.balance)||0)+item.amount;
        }
        if(item.isEstorno){
          d.expenses.push({id:uid(),name:item.name,category:'outros',amount:-item.amount,type:'once',payType:PT_CREDIT,split:item.split||'mine',date:item.date,oM:item.oM,oY:item.oY});
        }
        return d;
      });
    } else {
      onUpdateData(d=>{
        if(!d.expenses)d.expenses=[];
        d.expenses.push(item);
        if(item.payType===PT_BENEFIT){
          const acc=(d.accounts||[]).find(a=>a.id===item.accountId);
          if(acc)acc.balance=(parseFloat(acc.balance)||0)-item.amount;
        }
        if(item.payType===PT_DEBIT){
          const cost=item.split==='divisivel'?item.amount*(100-(cfg.partnerSplit||50))/100:(item.split==='partner_paid'||item.split==='partner_paid_total')?0:item.amount;
          if(cost>0){
            if(!d.payments)d.payments={};
            d.payments[`${item.id}:${item.oM}:${item.oY}`]={date:todayStr(),realAmount:cost};
            const acc=(d.accounts||[]).find(a=>a.type==='checking')||(d.accounts||[])[0];
            if(acc)acc.balance=(parseFloat(acc.balance)||0)-cost;
          }
        }
        return d;
      });
      setSelM(item.oM);setSelY(item.oY);
    }
    showToast('✅ Salvo!');
  };

  const upd=useCallback(fn=>onUpdateData(fn),[onUpdateData]);
  const visibleTabs=useMemo(()=>{
    const t=[{id:'visao',icon:'📊',label:'Visão'},{id:'gastos',icon:'💳',label:'Gastos'}];
    if(cfg.tabs.food)t.push({id:'aliment',icon:'🍽️',label:'Aliment.'});
    if(cfg.hasDivision&&cfg.tabs.division)t.push({id:'casinha',icon:'🏠',label:partner.slice(0,6)});
    if(cfg.tabs.goals)t.push({id:'metas',icon:'🎯',label:'Metas'});
    t.push({id:'proximo',icon:'🔮',label:'Próximo'});
    return t;
  },[cfg]);

  const months=useMemo(()=>{
    const out=[];
    for(let y=DY-1;y<=DY+1;y++)for(let m=0;m<12;m++)out.push({m,y,label:MN[m]+(y!==DY?''+(y%100):'')});
    return out.filter(x=>!(x.y===DY-1&&x.m<DM-2)&&!(x.y===DY+1&&x.m>DM+3));
  },[]);

  // month bar scroll
  const monthBarRef=useRef(null);
  useEffect(()=>{
    if(monthBarRef.current){
      const idx=months.findIndex(x=>x.m===selM&&x.y===selY);
      const chip=monthBarRef.current.children[idx];
      if(chip)chip.scrollIntoView({inline:'center',behavior:'smooth'});
    }
  },[selM,selY]);

  return h('div',{className:'app'},
    h(Toast,{msg:toast}),
    // header
    h('div',{className:'app-header'},
      h('div',{className:'app-logo'},
        h('span',null,'💸'),
        h('span',null,'Dinheiros')
      ),
      h('button',{onClick:()=>setShowSettings(true),
        style:{background:'none',border:'1.5px solid #d1fae5',borderRadius:12,padding:'8px 10px',fontSize:18,cursor:'pointer',background:'#fff'}},'⚙️')
    ),
    // month bar
    h('div',{className:'month-bar',ref:monthBarRef},
      months.map(x=>h('button',{
        key:x.m+'_'+x.y,
        className:'month-chip '+(x.m===selM&&x.y===selY?'active':'inactive'),
        onClick:()=>{setSelM(x.m);setSelY(x.y);}
      },x.label))
    ),
    // content
    h('div',{className:'app-content'},
      tab==='visao'&&h(TabVisao,{cfg,data,upd,selM,selY,cats,showToast}),
      tab==='gastos'&&h(TabGastos,{cfg,data,upd,selM,selY,cats,showToast,setShowAdd}),
      tab==='proximo'&&h(TabProximo,{cfg,data,selM,selY,cats}),
      tab==='metas'&&h(TabMetas,{cfg,data,upd,selM,selY,cats,showToast}),
      (tab==='casinha'&&cfg.hasDivision)&&h(TabCasinha,{cfg,data,upd,selM,selY,cats,showToast,partner:cfg.partnerName||'Parceiro'}),
      tab==='aliment'&&h(TabAliment,{cfg,data,upd,selM,selY,cats,showToast}),
    ),
    // FAB
    h('button',{className:'fab',onClick:()=>setShowAdd(true)},'+'),
    // wizard
    h(AddWizard,{show:showAdd,onClose:()=>setShowAdd(false),onSave:handleAdd,cfg,data,upd,setToast:showToast}),
    // tab bar
    h('div',{className:'tab-bar'},
      visibleTabs.map(t=>h('button',{key:t.id,className:'tab-btn '+(tab===t.id?'active':''),onClick:()=>setTab(t.id)},
        h('span',{className:'tab-icon'},t.icon),
        h('span',{className:'tab-label'},t.label)
      ))
    ),
    // settings sheet
    h(Sheet,{show:showSettings,onClose:()=>setShowSettings(false),title:'⚙️ Configurações'},
      showSettings&&h(Settings,{cfg,data,
        onUpdateCfg:newCfg=>{onUpdateCfg(newCfg);setShowSettings(false);},
        onUpdateData,
        onClose:()=>setShowSettings(false),
        onChangePin:()=>{setShowSettings(false);onLock();},
        onReset:parsed=>{
          if(parsed.config)onUpdateCfg(parsed.config);
          if(parsed.data)onUpdateData(()=>parsed.data);
        }
      })
    )
  );
};

// ── ROOT ──────────────────────────────────────────────────────────────────────
const Root=()=>{
  const [screen,setScreen]=useState('loading'); // loading | pin | onboarding | app | changePin
  const [cfg,setCfg]=useState(null);
  const [data,setData]=useState(null);
  const [changePinStep,setChangePinStep]=useState(0);
  const [newPin,setNewPin]=useState('');

  // load on mount
  useEffect(()=>{
    const savedCfg=loadJSON(SK_CONFIG);
    const hasPin=!!loadJSON(SK_PIN);
    if(!savedCfg){
      setScreen('onboarding');
    } else {
      setCfg(savedCfg);
      const savedData=loadJSON(SK_DATA('default'));
      setData(savedData||makeData());
      setScreen(hasPin?'pin':'app');
    }
  },[]);

  const handlePinSuccess=()=>{
    setScreen('app');
  };

  const handleOnboardingComplete=newCfg=>{
    const d=makeData();
    setCfg(newCfg);
    setData(d);
    saveJSON(SK_CONFIG,newCfg);
    saveJSON(SK_DATA('default'),d);
    setScreen('app');
  };

  const handleUpdateCfg=newCfg=>{
    setCfg(newCfg);
    saveJSON(SK_CONFIG,newCfg);
  };

  const handleUpdateData=fn=>{
    setData(d=>{
      const nd=fn(JSON.parse(JSON.stringify(d)));
      saveJSON(SK_DATA('default'),nd);
      return nd;
    });
  };

  const handleLock=()=>setScreen('pin');

  if(screen==='loading')return h('div',{className:'pin-screen'},h('div',{className:'pin-logo'},'💸'));

  if(screen==='onboarding')return h(Onboarding,{onComplete:handleOnboardingComplete});

  if(screen==='pin')return h(PinScreen,{mode:'unlock',onSuccess:handlePinSuccess});

  if(screen==='changePin')return h(PinScreen,{mode:'create',onSuccess:p=>{
    saveJSON(SK_PIN,hashPin(p));
    setScreen('app');
  },onCancel:()=>setScreen('app')});

  if(screen==='app'&&cfg&&data)return h(App,{
    cfg,data,
    onUpdateCfg:handleUpdateCfg,
    onUpdateData:handleUpdateData,
    onLock:handleLock,
  });

  return null;
};

ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
</script>
</body>
</html>
